<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meu site em container</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172033; background: #f3f6fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { max-width: 720px; background: white; border: 1px solid #e3e9f2; border-radius: 18px; padding: 40px; box-shadow: 0 18px 50px #1d355710; }
    .tag { display: inline-block; color: #075e54; background: #e4f5f1; padding: 7px 12px; border-radius: 999px; font-size: .85rem; font-weight: 700; }
    h1 { line-height: 1.15; font-size: clamp(2rem, 6vw, 3.2rem); margin: 22px 0 14px; }
    p { color: #526078; line-height: 1.7; }
    code { color: #075e54; background: #f0f7f5; padding: 2px 6px; border-radius: 5px; }
    .status { margin-top: 26px; padding: 16px; border-left: 4px solid #17a98b; background: #f2faf8; border-radius: 8px; }
  </style>
</head>
<body>
  <main>
    <span class="tag">Projeto Docker · Apache</span>
    <h1>Olá! Meu site está no ar.</h1>
    <p>Esta página está preparada para ser distribuída em um container baseado em <code>debian:trixie</code>, usando o servidor Apache HTTP.</p>
    <div class="status"><strong>Como acessar:</strong> depois de iniciar o container, abra <code>http://localhost:8080</code>.</div>
  </main>
</body>
</html>
